name: Run Python Script

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' 

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Run Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install opencv-python-headless numpy matplotlib scikit-learn tensorflow torch torchvision torchaudio

      - name: Run script
        run: python live-model.py # Replace main.py with your script's filename
